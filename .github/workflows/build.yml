name: Build Firmware

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'firmware/**'
      - 'platformio.ini'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - 'platformio.ini'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO & packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Copy config template to active config
        run: |
          cp firmware/config.example.h firmware/config.h

      - name: Build firmware and filesystem
        run: |
          pio run -e lolin32
          pio run -e lolin32 -t buildfs

      - name: Prepare Binary Artifacts
        run: |
          BUILD=.pio/build/lolin32
          FW=~/.platformio/packages/framework-arduinoespressif32
          PY=~/.platformio/penv/bin/python
          ESPTOOL=~/.platformio/packages/tool-esptoolpy/esptool.py

          echo "Build folder contents:"
          ls -la "$BUILD"

          # Copy boot_app0.bin
          if [ -f "$FW/tools/partitions/boot_app0.bin" ]; then
            cp "$FW/tools/partitions/boot_app0.bin" "$BUILD/boot_app0.bin"
          fi

          # Ensure bootloader.bin exists
          if [ ! -s "$BUILD/bootloader.bin" ]; then
            echo "bootloader.bin not in build folder, searching framework packages..."
            BL_BIN=$(find ~/.platformio/packages -name 'bootloader_dio_40m.bin' 2>/dev/null | head -n 1)
            BL_ELF=$(find ~/.platformio/packages -name 'bootloader_dio_40m.elf' 2>/dev/null | head -n 1)
            if [ -n "$BL_BIN" ]; then
              cp "$BL_BIN" "$BUILD/bootloader.bin"
            elif [ -n "$BL_ELF" ] && [ -f "$ESPTOOL" ]; then
              "$PY" "$ESPTOOL" --chip esp32 elf2image --flash_mode dio --flash_freq 40m --flash_size 4MB -o "$BUILD/bootloader.bin" "$BL_ELF"
            fi
          fi

      - name: Verify all binaries exist
        run: |
          cd .pio/build/lolin32
          missing=0
          for f in bootloader.bin partitions.bin boot_app0.bin firmware.bin littlefs.bin; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty build output: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            ls -la
            exit 1
          fi
          ls -l bootloader.bin partitions.bin boot_app0.bin firmware.bin littlefs.bin

      - name: Show flash offsets in run summary
        run: |
          {
            echo "### Flash offsets (ESP32 LOLIN32, default 4 MB partition table)"
            echo ""
            echo "| Offset | File |"
            echo "|--------|------|"
            echo "| 0x1000 | bootloader.bin |"
            echo "| 0x8000 | partitions.bin |"
            echo "| 0xe000 | boot_app0.bin |"
            echo "| 0x10000 | firmware.bin |"
            echo "| 0x290000 | littlefs.bin (web UI) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Firmware Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scout-v0.27.0-OP
          path: |
            .pio/build/lolin32/bootloader.bin
            .pio/build/lolin32/partitions.bin
            .pio/build/lolin32/boot_app0.bin
            .pio/build/lolin32/firmware.bin
            .pio/build/lolin32/littlefs.bin
          if-no-files-found: error
          retention-days: 30
