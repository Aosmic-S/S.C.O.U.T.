name: Build Firmware

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'firmware/**'
      - 'platformio.ini'
  pull_request:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - 'platformio.ini'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO & packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Copy config template to active config
        run: |
          cp firmware/config.example.h firmware/config.h

      - name: Build firmware and filesystem
        run: |
          pio run -e lolin32
          pio run -e lolin32 -t buildfs

      - name: Prepare Binary Artifacts
        run: |
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin .pio/build/lolin32/boot_app0.bin

      - name: Upload Firmware Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scout-firmware-v0.27.0-OP
          path: |
            .pio/build/lolin32/bootloader.bin
            .pio/build/lolin32/partitions.bin
            .pio/build/lolin32/boot_app0.bin
            .pio/build/lolin32/firmware.bin
            .pio/build/lolin32/littlefs.bin
          retention-days: 30
